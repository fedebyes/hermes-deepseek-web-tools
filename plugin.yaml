name: deepseek-web-tools
version: "1.0.0"
manifest_version: 2
description: "DeepSeek's server-side web tools as one tool: web_research answers a question from the live web with structured citations in a single call. thinking is opt-in (the server default bills up to ~20 searches) and page text never comes back - use web_extract for content."
author: Fedebyes
license: MIT
homepage: https://github.com/fedebyes/hermes-deepseek-web-tools
requires_hermes: ">=0.22.5"
provides_tools:
  - web_research
requires_env:
  - name: DEEPSEEK_API_KEY
    description: "DeepSeek API key. Searches and fetches are billed per successful request ($0.75 / 1,000)."
    url: https://platform.deepseek.com/api_keys
    secret: true
config_schema:
  model:
    type: str
    default: deepseek-flash
    description: "Model to drive the server tools with. The vendor documents the server tools for deepseek-flash."
  thinking:
    type: bool
    default: false
    description: "Enable deep thinking search by default for every call. Off: one search step, answer with citations. On: up to ~20 calls (search / open_page / find_in_page) and reasoning tokens billed, for multi-step fact-checking."
  with_read_url:
    type: bool
    default: true
    description: "Also declare deepseek_read_url, so URLs passed to the tool are read by the model. Harmless when no URL is passed."
  timeout_s:
    type: int
    default: 90
    description: "Per-attempt HTTP timeout in seconds. Three attempts plus backoff bound one call at about 4.5 minutes: the plugin API exposes no execution_timeout, so this is where the budget lives."
